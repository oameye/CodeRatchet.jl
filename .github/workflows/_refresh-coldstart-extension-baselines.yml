name: Refresh cold-start extension baselines

on:
  push:
    branches: [feat/coldstart-julia-1.13]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.13'

      - uses: julia-actions/cache@v2

      - name: Install pinned JETLS
        run: |
          julia -e 'using Pkg; Pkg.Apps.add(; url="https://github.com/aviatesk/JETLS.jl", rev="6893fcef26708d64360c048e039102c76ad032c0")'
          echo "$HOME/.julia/bin" >> "$GITHUB_PATH"

      - name: Build coverage tracefile
        run: |
          julia --project=. -e 'using Pkg; Pkg.test(coverage=true)'
          julia -e '
            using Pkg; Pkg.activate(temp=true); Pkg.add("CoverageTools")
            using CoverageTools
            folders = filter(isdir, ["src", "ext"])
            fcs = FileCoverage[]
            for f in folders; append!(fcs, process_folder(f)); end
            LCOV.writefile("lcov.info", fcs)'

      - name: Instantiate ratchet environment
        run: julia --project=code_ratchet -e 'using Pkg; Pkg.instantiate()'

      - name: Refresh and verify every gate
        run: |
          julia --project=code_ratchet \
            -e 'using CodeRatchet, JET; exit(CodeRatchet.main())' \
            all refresh --accept-change
          julia --project=code_ratchet \
            -e 'using CodeRatchet, JET; exit(CodeRatchet.main())' \
            all check

      - name: Commit generated baselines only
        run: |
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add code_ratchet/*_baseline.toml
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh extension quality baselines"
          git push

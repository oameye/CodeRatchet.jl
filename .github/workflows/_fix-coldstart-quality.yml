name: Fix cold-start quality

on:
  push:
    branches: [feat/coldstart-julia-1.13]
    paths:
      - .github/workflows/_fix-coldstart-quality.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/coldstart-julia-1.13
          fetch-depth: 0
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.13'
      - name: Apply reviewed cleanup
        run: python3 scripts/fix_coldstart_quality.py
      - name: Format Julia sources
        run: |
          julia -e 'using Pkg; Pkg.add(name="JuliaFormatter", version="2")'
          julia -e 'using JuliaFormatter; format(".")'
      - name: Run tests with coverage
        run: julia --project=. -e 'using Pkg; Pkg.test(coverage=true)'
      - name: Require complete cold-start coverage
        shell: bash
        run: |
          failed=0
          for f in src/coldstart.jl.*.cov src/coldstart_cli.jl.*.cov; do
            [ -e "$f" ] || continue
            zeros=$(awk '$1 == "0" { print NR ":" $0 }' "$f")
            if [ -n "$zeros" ]; then
              echo "$f"
              echo "$zeros"
              failed=1
            fi
          done
          exit "$failed"
      - name: Require no new cold-start complexity candidates
        shell: bash
        run: |
          julia --project=code_ratchet -e 'using Pkg; Pkg.instantiate()'
          julia --project=code_ratchet -e 'using CodeRatchet; exit(CodeRatchet.main(["complexity", "candidates"]))' > candidates.txt
          cat candidates.txt
          ! grep -E 'src/coldstart(_cli)?\.jl' candidates.txt
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'Orjan Ameye'
          git config user.email 'orjan.ameye@hotmail.com'
          git rm -f .github/workflows/_diagnose-coldstart-coverage.yml .github/workflows/_fix-coldstart-quality.yml scripts/fix_coldstart_quality.py
          git add src/coldstart.jl test/coldstart_metric.jl Project.toml
          git commit -m 'test: close cold-start quality gaps'
          git push origin HEAD:feat/coldstart-julia-1.13

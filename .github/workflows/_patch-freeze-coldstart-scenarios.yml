name: Patch cold-start workload provenance

on:
  push:
    branches: ['feat/coldstart-julia-1.13']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/coldstart-julia-1.13
      - name: Freeze scenarios to the base revision
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('src/coldstart.jl')
          text = source.read_text()

          anchor = '''function write_coldstart_results(
            report::ColdStartReport,
            output_dir::AbstractString,
            base::AbstractString,
            head::AbstractString,
          )
          '''
          replacement = '''function coldstart_scenario_file(
            base::AbstractString, head::AbstractString, config::ColdStartConfig
          )
            if isabspath(config.scenarios)
              isfile(config.scenarios) ||
                error("cold-start scenario registry not found: $(config.scenarios)")
              return (file=String(config.scenarios), source="absolute")
            end

            base_file = joinpath(base, config.scenarios)
            isfile(base_file) && return (file=base_file, source="base")

            head_file = joinpath(head, config.scenarios)
            isfile(head_file) || error("cold-start scenario registry not found: $head_file")
            return (file=head_file, source="head-bootstrap")
          end

          function write_coldstart_results(
            report::ColdStartReport,
            output_dir::AbstractString,
            base::AbstractString,
            head::AbstractString;
            scenario_file::AbstractString="",
            scenario_source::AbstractString="head",
          )
          '''
          if text.count(anchor) != 1:
              raise SystemExit(f'write_coldstart_results anchor count: {text.count(anchor)}')
          text = text.replace(anchor, replacement)

          old = '''  write(joinpath(output_dir, "summary.md"), coldstart_markdown(report))
            scenario_file = if isabspath(report.config.scenarios)
            report.config.scenarios
          else
            joinpath(head, report.config.scenarios)
          end
            open(joinpath(output_dir, "metadata.txt"), "w") do io
          '''
          new = '''  write(joinpath(output_dir, "summary.md"), coldstart_markdown(report))
            selected_scenario_file = if isempty(scenario_file)
              isabspath(report.config.scenarios) ?
              report.config.scenarios : joinpath(head, report.config.scenarios)
            else
              String(scenario_file)
            end
            open(joinpath(output_dir, "metadata.txt"), "w") do io
          '''
          if text.count(old) != 1:
              raise SystemExit(f'metadata scenario anchor count: {text.count(old)}')
          text = text.replace(old, new)

          old = '''    println(io, "head_commit=", full_commit(head))
              println(io, "scenario_hash=", coldstart_file_hash(scenario_file))
          '''
          new = '''    println(io, "head_commit=", full_commit(head))
              println(io, "scenario_source=", scenario_source)
              println(io, "scenario_path=", report.config.scenarios)
              println(io, "scenario_hash=", coldstart_file_hash(selected_scenario_file))
          '''
          if text.count(old) != 1:
              raise SystemExit(f'metadata provenance anchor count: {text.count(old)}')
          text = text.replace(old, new)

          old = '''  config = coldstart_config(head_path; dir=config_dir)
            scenario_file =
              isabspath(config.scenarios) ? config.scenarios : joinpath(head_path, config.scenarios)
            isfile(scenario_file) || error("cold-start scenario registry not found: $scenario_file")

            scenarios, builds, samples = mktempdir() do temporary
              return run_coldstart_experiment(
                base_path, head_path, package, scenario_file, config, temporary
              )
            end
          '''
          new = '''  config = coldstart_config(head_path; dir=config_dir)
            scenario = coldstart_scenario_file(base_path, head_path, config)

            scenarios, builds, samples = mktempdir() do temporary
              return run_coldstart_experiment(
                base_path, head_path, package, scenario.file, config, temporary
              )
            end
          '''
          if text.count(old) != 1:
              raise SystemExit(f'comparison scenario anchor count: {text.count(old)}')
          text = text.replace(old, new)

          old = '''  report = ColdStartReport(config, scenarios, builds, samples, verdicts)
            isempty(output_dir) || write_coldstart_results(report, output_dir, base_path, head_path)
            return report
          end
          '''
          new = '''  report = ColdStartReport(config, scenarios, builds, samples, verdicts)
            isempty(output_dir) ||
              write_coldstart_results(
                report,
                output_dir,
                base_path,
                head_path;
                scenario_file=scenario.file,
                scenario_source=scenario.source,
              )
            return report
          end
          '''
          if text.count(old) != 1:
              raise SystemExit(f'writer call anchor count: {text.count(old)}')
          text = text.replace(old, new)

          old = '''The experiment owns fresh temporary depots. Dependency installation and one
          unmeasured package-cache build happen first. Each measured build then gets a
          fresh writable depot layered over the seeded dependency depot. Build order
          alternates base/head then head/base to reduce monotonic runner drift, and every
          scenario sample runs in a fresh Julia process.
          '''
          new = '''The experiment owns fresh temporary depots. Dependency installation and one
          unmeasured package-cache build happen first. Each measured build then gets a
          fresh writable depot layered over the seeded dependency depot. Build order
          alternates base/head then head/base to reduce monotonic runner drift, and every
          scenario sample runs in a fresh Julia process. A relative scenario registry is
          frozen to the base revision; head is used only when the base has no registry yet.
          '''
          if text.count(old) != 1:
              raise SystemExit(f'docstring anchor count: {text.count(old)}')
          source.write_text(text.replace(old, new))

          test = Path('test/coldstart_metric.jl')
          text = test.read_text()
          anchor = '''  @testset "median and materiality are exact" begin
          '''
          addition = '''  @testset "scenario registry is frozen to base after bootstrap" begin
            mktempdir() do root
              base = joinpath(root, "base")
              head = joinpath(root, "head")
              mkpath(base)
              mkpath(head)
              config = CodeRatchet.ColdStartConfig("scenarios.jl", 1, 1, 0, 0.0, 1)

              write(joinpath(head, "scenarios.jl"), "head\n")
              scenario = CodeRatchet.coldstart_scenario_file(base, head, config)
              @test scenario.source == "head-bootstrap"
              @test scenario.file == joinpath(head, "scenarios.jl")

              write(joinpath(base, "scenarios.jl"), "base\n")
              scenario = CodeRatchet.coldstart_scenario_file(base, head, config)
              @test scenario.source == "base"
              @test scenario.file == joinpath(base, "scenarios.jl")
            end
          end

          ''' + anchor
          if text.count(anchor) != 1:
              raise SystemExit(f'test insertion anchor count: {text.count(anchor)}')
          text = text.replace(anchor, addition)

          old = '''      CodeRatchet.write_coldstart_results(report, output, pwd(), pwd())
                @test isfile(joinpath(output, "builds.tsv"))
          '''
          new = '''      scenario_file = joinpath(output, "scenarios.jl")
                write(scenario_file, "nothing\n")
                CodeRatchet.write_coldstart_results(
                  report, output, pwd(), pwd(); scenario_file, scenario_source="base"
                )
                @test isfile(joinpath(output, "builds.tsv"))
          '''
          if text.count(old) != 1:
              raise SystemExit(f'provenance writer anchor count: {text.count(old)}')
          text = text.replace(old, new)

          old = '''      @test occursin("runner_image=", metadata)
                @test occursin("scenario_hash=", metadata)
          '''
          new = '''      @test occursin("runner_image=", metadata)
                @test occursin("scenario_source=base", metadata)
                @test occursin("scenario_path=scenarios.jl", metadata)
                @test occursin("scenario_hash=", metadata)
                @test !occursin("scenario_hash=unknown", metadata)
          '''
          if text.count(old) != 1:
              raise SystemExit(f'provenance assertions anchor count: {text.count(old)}')
          text = text.replace(old, new)

          old = '''      metadata = read(joinpath(output, "metadata.txt"), String)
                @test !occursin("scenario_hash=unknown", metadata)
          '''
          new = '''      metadata = read(joinpath(output, "metadata.txt"), String)
                @test occursin("scenario_source=head-bootstrap", metadata)
                @test !occursin("scenario_hash=unknown", metadata)
          '''
          if text.count(old) != 1:
              raise SystemExit(f'bootstrap provenance anchor count: {text.count(old)}')
          test.write_text(text.replace(old, new))

          readme = Path('README.md')
          text = readme.read_text()
          anchor = '''`metrics` narrows `[metrics].run` for that job and can never add to it.
          Narrowing is a legitimate thing to want: a repository whose JET is already
          gated absolutely by another workflow should not pay for JET twice. Widening
          would be a second source of truth, so it is refused.

          ### By hand
          '''
          replacement = '''`metrics` narrows `[metrics].run` for that job and can never add to it.
          Narrowing is a legitimate thing to want: a repository whose JET is already
          gated absolutely by another workflow should not pay for JET twice. Widening
          would be a second source of truth, so it is refused.

          ### Cold-start regression tracking

          Cold-start is a separate paired experiment rather than a persistent metric.
          It compares exact base and head revisions on the same runner, with independent
          target-package cache builds and fresh Julia processes for each scenario sample.
          Only package precompile time and total time-to-first-execution gate; import,
          compilation/recompilation, warm latency and cache bytes remain diagnostic context.

          Put representative zero-argument workloads in
          `benchmark/precompile/scenarios.jl` as an ordered named tuple named
          `PRECOMPILE_BENCHMARKS`. For an ordinary PR, CodeRatchet deliberately uses the
          **base revision's** scenario file for both revisions, so the candidate cannot
          silently redefine the benchmark that judges it. The head scenario file is used
          only to bootstrap a repository whose base has no scenario registry yet. The
          result artifact records `scenario_source`, `scenario_path` and `scenario_hash`.

          ```toml
          [coldstart]
          scenarios = "benchmark/precompile/scenarios.jl"
          builds = 2
          samples = 5
          absolute_ms = 50
          relative = 0.05
          precompile_tasks = 1
          ```

          The reusable `coldstart.yml` workflow performs the paired comparison. Timing is
          intentionally not written into the normal CodeRatchet baseline: runner noise is
          handled by same-run base/head comparison and explicit materiality floors instead.

          ### By hand
          '''
          if text.count(anchor) != 1:
              raise SystemExit(f'README insertion anchor count: {text.count(anchor)}')
          readme.write_text(text.replace(anchor, replacement))
          PY
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.13'
      - name: Format Julia changes
        run: |
          julia -e 'using Pkg; Pkg.add(name="JuliaFormatter", version="2")'
          julia -e 'using JuliaFormatter; format("src/coldstart.jl"); format("test/coldstart_metric.jl")'
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/coldstart.jl test/coldstart_metric.jl README.md
          git commit -m 'fix: freeze cold-start scenarios to the base revision'
          git push origin HEAD:feat/coldstart-julia-1.13

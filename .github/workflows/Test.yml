name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Julia ${{ matrix.julia }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 1.13 is the floor by choice. The technical floor is 1.12 (Boxes needs
        # Base.visit and 1.12's lowering, Docstrings needs 1.11's `public`),
        # but 1.12 is no longer supported, so it is no longer tested.
        julia: ['1.13']
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}
      - uses: julia-actions/cache@v2
      # The fixtures are real git repositories, because the gate takes its file
      # list from `git ls-files`. Committing in one needs an identity.
      - name: Give git an identity for the fixtures
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1

  # The gate, run on this package. Every metric here was verified by hand on my
  # machine and by fixture in the suite; pointing the tool at its own repository
  # is what found an init that emitted TOML which does not parse, three Core.Box
  # allocations, twelve JET reports and a `dir` argument that went nowhere.
  # Calling the reusable workflow by local path also tests that workflow on
  # every push, which is otherwise only exercised by a consumer repository.
  selfcheck:
    name: Self-check
    needs: test
    uses: ./.github/workflows/ratchet.yml
    with:
      # An exact patch, not '1.13': the lsp baseline records jetls's
      # "julia version 1.13.1" string, and a newer patch would not compare.
      julia-version: '1.13.1'
      coverage: true
      install-jetls: true
      # The revision the lsp baseline was taken under. `release` moves, and an
      # unpinned tool reddens the gate for a change nobody made.
      jetls-rev: '2b51ac041fe9b1901ce8ead3ed88753721de3035'

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      # Pkg.Apps.add, which is how the formatter is installed locally, cannot
      # resolve a name on a runner with no registry cloned yet. Plain Pkg.add
      # installs the registry as a side effect, so the package API is used
      # rather than the `jlfmt` binary.
      - run: julia -e 'using Pkg; Pkg.add(name="JuliaFormatter", version="2")'
      - name: Check formatting
        run: |
          julia -e 'using JuliaFormatter; exit(format(".", overwrite=false) ? 0 : 1)'

name: Apply cold-start extension refactor

on:
  push:
    branches: [feat/coldstart-julia-1.13]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply validated refactor
        run: python scripts/apply_coldstart_extension.py

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.13'

      - name: Format transformed Julia sources
        run: |
          julia -e 'using Pkg; Pkg.add(name="JuliaFormatter", version="2")'
          julia -e 'using JuliaFormatter; format(".")'

      - name: Commit source and test changes
        run: |
          # Workflow files are landed separately through the authenticated
          # GitHub connector; GITHUB_TOKEN may not modify workflow definitions.
          git restore .github/workflows/coldstart.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Project.toml README.md src/ ext/ test/coldstart_metric.jl
          git commit -m "perf: keep cold-start harness out of core precompile"
          git push

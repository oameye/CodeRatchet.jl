# The gate, as a workflow an adopting repository calls rather than copies.
#
#   jobs:
#     ratchet:
#       uses: oameye/CodeRatchet.jl/.github/workflows/ratchet.yml@<CODE_RATCHET_SHA>
#       with:
#         julia-version: '1.13'
#
# Copying a workflow into forty repositories means forty copies that drift.
# Calling one means the gate's CI behaviour has a single definition. The
# workflow and code_ratchet/Project.toml must pin the same exact commit, so the
# implementation running the gate cannot drift from the workflow around it.

name: Ratchet

on:
  workflow_call:
    inputs:
      julia-version:
        description: 'Julia version to run the gate under.'
        type: string
        default: '1.13'
      ratchet-dir:
        description: 'Where rulings.toml and the baselines live.'
        type: string
        default: 'code_ratchet'
      metrics:
        description: >-
          Comma-separated subset of [metrics].run to check, for a repository
          whose CI already gates one of them elsewhere. It can only narrow that
          list, never add to it. Empty runs everything configured.
        type: string
        default: ''
      coverage:
        description: >-
          Run the package's tests with coverage and build an lcov.info before
          checking. Needed by the coverage metric, which measures a tracefile
          rather than the source: without this the gate has nothing to read.
        type: boolean
        default: false
      install-jetls:
        description: 'Install the jetls binary. Needed only by the lsp metric.'
        type: boolean
        default: false
      jetls-rev:
        description: >-
          Which JETLS revision to install. PIN THIS to a commit. `release` is a
          moving branch, and JETLS adds diagnostics between releases, so an
          unpinned tool changes the numbers under a baseline nobody touched and
          the gate goes red for a reason no contributor caused. The lsp metric
          records the tool version in provenance and refuses to compare across
          versions, so an unpinned rev turns into a red gate rather than a
          wrong answer, but a red gate nobody caused is how a gate gets
          switched off.
        type: string
        default: 'release'
      timeout-minutes:
        description: 'Cap on the whole job. JET and JETLS are the slow parts.'
        type: number
        default: 30

jobs:
  ratchet:
    name: Ratchet
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ inputs.julia-version }}

      - uses: julia-actions/cache@v2

      - name: Install jetls
        if: ${{ inputs.install-jetls }}
        run: |
          julia -e 'using Pkg; Pkg.Apps.add(; url="https://github.com/aviatesk/JETLS.jl", rev="${{ inputs.jetls-rev }}")'
          echo "$HOME/.julia/bin" >> "$GITHUB_PATH"

      # The coverage metric reads a tracefile, so something has to produce one.
      # Done here rather than left to the caller because every consumer running
      # that metric needs exactly these two steps.
      - name: Build a coverage tracefile
        if: ${{ inputs.coverage }}
        run: |
          julia --project=. -e 'using Pkg; Pkg.test(coverage=true)'
          julia -e '
            using Pkg; Pkg.activate(temp=true); Pkg.add("CoverageTools")
            using CoverageTools
            folders = filter(isdir, ["src", "ext"])
            fcs = FileCoverage[]
            for f in folders; append!(fcs, process_folder(f)); end
            LCOV.writefile("lcov.info", fcs)'

      - name: Instantiate the ratchet environment
        run: julia --project=${{ inputs.ratchet-dir }} -e 'using Pkg; Pkg.instantiate()'

      # A reusable workflow has its own exact implementation commit. Refuse to
      # measure with a different CodeRatchet commit installed in the ratchet
      # environment: workflow semantics and metric semantics are one version.
      - name: Verify workflow and tool revision agree
        env:
          CODERATCHET_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          julia --project=${{ inputs.ratchet-dir }} -e '
            using CodeRatchet
            workflow = CodeRatchet.exact_git_revision(ENV["CODERATCHET_WORKFLOW_SHA"])
            tool = CodeRatchet.installed_coderatchet_revision()
            tool == workflow || error(
              "CodeRatchet workflow/tool revision mismatch: workflow $workflow, " *
              "installed tool $tool. Pin ratchet.yml and code_ratchet/Project.toml " *
              "to the same exact commit."
            )'

      # JET lives in a package extension, so it must be loaded for the jet
      # metric to resolve. Loading it when the repository does not run that
      # metric costs a little time and breaks nothing.
      - name: Check every configured gate
        run: |
          ONLY=""
          if [ -n "${{ inputs.metrics }}" ]; then ONLY="--only ${{ inputs.metrics }}"; fi
          julia --project=${{ inputs.ratchet-dir }} \
            -e 'using CodeRatchet; try; @eval using JET; catch; end; exit(CodeRatchet.main())' \
            all check $ONLY

      # The point of the artifact: a contributor fixes a red gate by
      # downloading this and committing it, with no Julia and no local setup.
      - name: Upload the refresh artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coderatchet-refresh
          path: ${{ inputs.ratchet-dir }}/_refresh/
          if-no-files-found: ignore

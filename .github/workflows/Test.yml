name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Julia ${{ matrix.julia }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 1.12 is the floor: `boxes` needs Base.visit and `docstrings` reads the
        # `public` keyword.
        julia: ['1.12', '1.13']
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      # Pkg.Apps.add, which is how the formatter is installed locally, cannot
      # resolve a name on a runner with no registry cloned yet. Plain Pkg.add
      # installs the registry as a side effect, so the package API is used
      # rather than the `jlfmt` binary.
      - run: julia -e 'using Pkg; Pkg.add(name="JuliaFormatter", version="2")'
      - name: Check formatting
        run: |
          julia -e 'using JuliaFormatter; exit(format(".", overwrite=false) ? 0 : 1)'

name: Apply cold-start protocol corrections

on:
  push:
    branches:
      - feat/coldstart-julia-1.13
    paths:
      - scripts/apply_coldstart_protocol_patch.py
      - .github/workflows/_apply-coldstart-protocol.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/coldstart-julia-1.13
          fetch-depth: 0

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.13'

      - name: Apply reviewed protocol patch
        run: python3 scripts/apply_coldstart_protocol_patch.py

      - name: Format Julia sources
        run: |
          julia -e 'using Pkg; Pkg.add(name="JuliaFormatter", version="2")'
          julia -e 'using JuliaFormatter; format("src/coldstart.jl"); format("test/coldstart_metric.jl")'

      - name: Check patch whitespace
        run: git diff --check

      - name: Run package tests
        run: julia --project=. -e 'using Pkg; Pkg.test()'

      - name: Commit reviewed patch
        run: |
          git config user.email "ci@example.com"
          git config user.name "CodeRatchet CI"
          git add Project.toml README.md src/coldstart.jl test/coldstart_metric.jl
          git diff --cached --quiet && { echo 'patch produced no changes'; exit 1; }
          git commit -m "fix: harden paired cold-start protocol"
          git push origin HEAD:feat/coldstart-julia-1.13

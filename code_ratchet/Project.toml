# The code-quality environment, separate from test/ on purpose: the cheap
# gates load nothing under measurement and only the expensive ones need the
# package itself.
#
# CodeRatchet is not registered, so [sources] names the repository. The rev is
# a commit rather than a branch: a gate's numbers depend on the tool that
# measured them, so a tool free to move would move the gate underneath you.

[deps]
CodeRatchet = "0e86a969-c127-44ad-8bee-7851ffae31d4"
JET = "c3a54625-cd67-489e-a8e7-0a5a0ff4e31b"

[sources]
CodeRatchet = {path = ".."}

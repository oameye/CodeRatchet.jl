name: Validate cold-start extension

on:
  push:
    branches: [feat/coldstart-julia-1.13]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Apply extension refactor in working tree
        run: python scripts/apply_coldstart_extension.py

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.13'

      - name: Format transformed tree
        run: |
          julia -e 'using Pkg; Pkg.add(name="JuliaFormatter", version="2")'
          julia -e 'using JuliaFormatter; format(".")'
          git diff --check

      - name: Run package tests
        run: julia --project=. -e 'using Pkg; Pkg.test()'

      - name: Check out main for paired comparison
        uses: actions/checkout@v4
        with:
          ref: main
          path: base
          persist-credentials: false

      - name: Instantiate ratchet tooling
        run: julia --project=code_ratchet -e 'using Pkg; Pkg.instantiate()'

      - name: Compare transformed tree against main
        run: |
          julia --project=code_ratchet \
            -e 'using Pkg, CodeRatchet; exit(CodeRatchet.coldstart_main())' \
            compare \
            --base "$GITHUB_WORKSPACE/base" \
            --head "$GITHUB_WORKSPACE" \
            --ratchet-dir code_ratchet \
            --output "$GITHUB_WORKSPACE/coldstart-extension-results"

      - name: Show transformed diff
        if: always()
        run: git diff --stat && git diff -- Project.toml src/CodeRatchet.jl src/all.jl ext/CodeRatchetColdStartExt.jl .github/workflows/coldstart.yml README.md test/coldstart_metric.jl
